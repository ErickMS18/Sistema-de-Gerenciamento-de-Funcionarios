
<html>

    <head>
        <meta charset="UTF-8">
        <link id="theme-style" rel="stylesheet" href="default-theme.css">
        <script src="js/index.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CatGangSignUp</title>
    </head>

    <body class="body"> 
        <form id="form-cadastro">
                <div class="bloco">
                    <div class="texto1">
                        Cadastre-se
                    </div>
                    <div class="texto2">
                        Crie sua conta
                    </div>
                    <div class="info">
                        <div class="user">
                        <input class="user1" type="text" name="name" id="user1" placeholder="Nome de Usuário">

                        </div>
                        <div class="email">
                            <input class="email1" type="text" name="email" id="email1" placeholder="E-mail">
                            
                        </div>
                        <div class="password">
                            <input class="password1" type="password" name="password" id="pass1" placeholder="Senha">
                            
                        </div>
                        <div class="password2">
                            <input class="password21" type="password" name="check_pass" id="pass2" placeholder="Confirme sua senha">                    
                        </div>

                    </div>
                    <div class="signup">
                        <button class="botao" onclick="gravar()" type="button">Cadastre-se</button>

                    </div>
                    <a href="../../index.html">
                        <div class="texto3">
                        Já tem um cadastro? Faça o Login
                        
                        </div>
                    </a>

                </div>
        </form>
        
    </body>
</html>
